name: RAX3000ME Build ImmortalWrt 25.12 for 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新增：获取当前日期
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: |
          # 克隆 25.12 仓库源码
          git clone https://github.com/hnjjw2024/immortalwrt-mt798x-25.12.git openwrt
          cd openwrt
          
          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 直接复制配置文件
          cp defconfig/456.config .config
          # 下载编译所需的源码包
          make download -j$(nproc)
          # 开始编译
          make -j$(nproc)
          
          # 删除 packages 目录（不需要上传）
          rm -rf bin/targets/mediatek/filogic/packages
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000me-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: warn

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "RAX3000ME 固件 ${{ steps.date.outputs.date }} #${{ github.run_number }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body: |
            ## 自动编译固件
            
            - 编译时间：${{ steps.date.outputs.date }}
            - 编译编号：#${{ github.run_number }}
            - 设备：CMCC RAX3000ME (eMMC / NAND)
            - 内核：6.12（25.12 版本）
            - 包含插件：OpenClash、磁盘管理、Argon 主题等
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
